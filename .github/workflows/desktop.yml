# 윈도우용 내려받는 앱(설치 파일 .exe)을 GitHub Actions의 윈도우 기계에서 만든다. 관리자의 컴퓨터가 맥이라 윈도우 빌드는 여기서만 한다.
# 하는 일: 서버 · 화면 · Node를 묶고(scripts/bundle-app.mjs) → 그 서버가 윈도우에서 도는지 보고 화면을 찍고(scripts/ci/desktop-smoke.mjs)
#          → Tauri 창을 NSIS 설치 파일로 만든다. 설치 파일과 그림은 산출물 windows-installer · windows-shots로 남는다.
# 언제 도나:
# - 묶기 · 창 · 서버 · 이 파일을 바꾼 PR (서버가 윈도우에서 도는지 PR마다 본다) (Actions 화면에서 손으로도 돌릴 수 있다)
# - 릴리스: Actions 화면 › Desktop (Windows) › Run workflow에서 「릴리스로 내기」를 켜고 돌린다(버전을 비우면 마지막 릴리스의 다음 번호).
#   같은 일을 한 뒤 그 번호의 태그와 GitHub 릴리스를 만들고 설치 파일을 붙인다 (내려받기 쪽: 릴리스의 Assets).
#   태그를 올릴 수 없는 클라우드 에이전트도 이 실행은 돌릴 수 있다(11/8 "릴리스를 매번 따로 해야 해?").
# - v로 시작하는 태그를 직접 올려도 같은 일을 한다
# 서명하지 않은 설치 파일이라 처음 실행할 때 윈도우가 "PC 보호" 창을 띄운다(추가 정보 › 실행). 서명은 docs/install-windows.md.
# 바깥 액션은 ci.yml처럼 커밋 SHA로 고정한다.
name: Desktop (Windows)

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'scripts/bundle-app.mjs'
      - 'scripts/ci/desktop-smoke.mjs'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '릴리스로 내기 (끄면 설치 파일만 만든다)'
        type: boolean
        default: false
      version:
        description: '버전 (예: 0.3.0). 비우면 마지막 릴리스의 다음 번호'
        type: string
        default: ''

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # 앱 버전과 릴리스 태그: 태그로 돌면 그 번호, 「릴리스로 내기」면 적은 번호나 마지막 릴리스의 다음 번호, 그 밖은 tauri.conf.json (태그 없음)
      - name: 버전 정하기
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_RELEASE: ${{ inputs.release }}
          WANT_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          tag=""
          case "$GITHUB_REF" in refs/tags/v*) version="${GITHUB_REF#refs/tags/v}"; tag="v$version" ;; esac
          if [ "$WANT_RELEASE" = "true" ]; then
            if [ -n "$WANT_VERSION" ]; then
              version="${WANT_VERSION#v}"
            else
              last=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
              IFS=. read -r major minor patch <<< "${last#v}"
              version="$major.$minor.$((patch + 1))"
            fi
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::버전은 0.3.0 모양이어야 합니다: $version"; exit 1; }
            tag="v$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag 태그가 이미 있습니다. 다른 번호를 적거나 비워 두세요."; exit 1
            fi
          fi
          echo "버전 $version · 태그 ${tag:-없음}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # 묶기 전에: 바깥에서 받을 것이 없어 GitHub 내려받기가 막혀도 이 시험은 돈다
      - name: 계정 동기화 · 열쇠 보관이 윈도우에서 되는지 보기
        run: pnpm --filter @rw/server exec vitest run src/accountSync.test.ts src/secretStore.test.ts src/githubAccount.test.ts
      - name: 서버 · 화면 · Node 묶기
        run: node scripts/bundle-app.mjs --platform win32 --arch x64
      - name: 묶은 서버가 윈도우에서 도는지 보기
        run: node scripts/ci/desktop-smoke.mjs --print --shots desktop-shots --chrome "C:\Program Files\Google\Chrome\Application\chrome.exe"
      - name: 설치 파일 만들기
        shell: bash
        working-directory: desktop/src-tauri
        env:
          version: ${{ steps.ver.outputs.version }}
        run: |
          npx -y @tauri-apps/cli@2.12.4 icon ../../scripts/app-icon.svg
          # 창 코드 시험 (포트 · 열쇠 · 바깥으로 여는 주소): 아이콘을 만든 뒤라야 빌드된다
          cargo test
          # tauri가 NSIS를 GitHub 릴리스에서 받다가 504로 멈출 때가 있어(11/8) 세 번까지 다시 (컴파일은 남아 있어 금방)
          for i in 1 2 3; do
            npx -y @tauri-apps/cli@2.12.4 build --bundles nsis --config tauri.standalone.conf.json --config "{\"version\":\"$version\"}" && break
            [ "$i" = 3 ] && exit 1
            echo "설치 파일 만들기 다시 ($i)"; sleep $((i * 20))
          done
          ls -la target/release/bundle/nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-shots
          path: desktop-shots
          if-no-files-found: ignore

  # 태그로 돌았거나 「릴리스로 내기」일 때만: 설치 파일을 그 태그의 릴리스에 붙인다 (태그 · 릴리스가 없으면 이 커밋에 만든다)
  # GITHUB_TOKEN으로 만든 태그는 이 파일을 다시 돌리지 않는다(GitHub 규칙)
  release:
    needs: windows
    if: needs.windows.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # 이름에 번호를 넣지 않아 releases/latest/download/EmergenceWorkbench_x64-setup.exe가 늘 최신 설치 파일을 가리킨다
          # (친구 안내서의 「설치 파일 받기」 버튼, 11/9 "밑에 소스코드 두 개도 받는 거임?"). 앱의 새 버전 알림은 x64-setup.exe로 끝나는 파일을 찾는다
          mv out/*.exe out/EmergenceWorkbench_x64-setup.exe
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Emergence Workbench $TAG" --generate-notes \
                 --notes "윈도우 설치 파일: 아래 Assets의 EmergenceWorkbench_x64-setup.exe 하나만 받아 실행하세요. Source code 두 개는 코드 묶음이라 받지 않아도 됩니다. 안내: docs/install-windows.md"
          gh release upload "$TAG" out/EmergenceWorkbench_x64-setup.exe -R "$GITHUB_REPOSITORY" --clobber
