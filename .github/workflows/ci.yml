# PR마다 저장소 규칙의 검사(pnpm type-check, pnpm test)와 화면 빌드를 돌린다.
# 에이전트는 이 검사가 초록이면 PR을 합친다 (planning/requirements.md §8.1).
# Actions 분량(비공개 저장소는 한 달 2,000분)을 아끼려고:
# - main 푸시에서는 돌리지 않는다. PR이 한 번에 하나씩 합쳐지므로 PR 검사가 합친 뒤의 코드와 같다. 필요하면 Actions 화면에서 손으로 돌린다.
# - 문서·계획·피드백 원문·그림만 바뀐 PR은 건너뛴다. feedback/status.yaml과 reviews.yaml은 테스트가 읽으므로 검사한다.
name: CI

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'planning/**'
      - 'feedback/*.md'
      - 'feedback/pictures/**'
      - 'feedback/preview/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # scripts/remote 테스트는 맥과 같은 zsh로 스크립트를 돌린다. 나눔 글꼴은 화면 그림의 한글용.
      # man-db 색인 갱신을 끄면 apt 설치가 빨라진다
      # 미러가 멈추면 apt가 작업 시간 10분을 다 써 버린다 (10/7 두 번): 2분마다 끊고 세 번까지 다시 한다
      - run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          for i in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update -qq && sudo timeout 120 apt-get $apt_opts install -y -qq --no-install-recommends zsh fonts-nanum && exit 0
            echo "apt 시도 $i 실패, 다시 한다"
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      # 주요 화면을 예제 모드로 찍고, 화면마다 오류 없이 그려지는지 확인한다. 그림은 산출물로 남는다
      # 브라우저는 내려받지 않고 실행기(ubuntu-latest)에 깔려 있는 Chrome을 쓴다
      - run: pnpm shots --viewport 1200x735 --theme mixed --sample default
        env:
          SHOTS_SKIP_BUILD: '1'
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
