# PR마다 저장소 규칙의 검사(pnpm type-check, pnpm test)와 화면 빌드를 돌린다.
# 에이전트는 이 검사가 초록이면 PR을 합친다 (CLAUDE.md "반영 흐름").
# Actions 분량을 아끼려고:
# - main 푸시에서는 돌리지 않는다. PR이 한 번에 하나씩 합쳐지므로 PR 검사가 합친 뒤의 코드와 같다. 필요하면 Actions 화면에서 손으로 돌린다.
# - 문서만 바뀐 PR은 건너뛴다: docs/와 어디에 있든 .md. 다만 fixtures/·templates/의 .md는 예제·서식 내용이라(테스트와 화면 그림이 읽는다) 돌린다.
#   paths-ignore는 되살리는(!) 규칙이 없어 paths로 쓴다. 뒤 줄이 앞 줄을 이긴다.
# - 바깥 액션은 커밋 SHA로 고정하고 옆에 버전을 적는다 (태그는 옮겨질 수 있다). 올릴 때는 git ls-remote로 새 태그의 SHA를 찾는다.
name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'fixtures/**'
      - 'templates/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 소개 검사(check-about.mjs)가 PR의 커밋 메시지와 바뀐 파일을 기준 커밋과 견준다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # scripts/remote 테스트는 맥과 같은 zsh로 스크립트를 돌린다. 나눔 글꼴은 화면 그림의 한글용.
      # man-db 색인 갱신을 끄면 apt 설치가 빨라진다
      # 미러가 멈추면 apt가 작업 시간 10분을 다 써 버린다 (10/7 두 번): 받기 45초 · 설치 60초에 끊고 세 번까지 다시 한다.
      # 가장 나쁠 때 3 × 105초 ≈ 5분 남짓, 단계 한도 6분이라 나머지 검사에 시간이 남는다 (전에는 3 × 240초 = 12분으로 10분을 넘을 수 있었다)
      - timeout-minutes: 6
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts='-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15'
          for i in 1 2 3; do
            sudo timeout 45 apt-get $apt_opts update -qq && sudo timeout 60 apt-get $apt_opts install -y -qq --no-install-recommends zsh fonts-nanum && exit 0
            echo "apt 시도 $i 실패, 다시 한다"
          done
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
        env:
          ABOUT_BASE: ${{ github.event.pull_request.base.sha }}
          ABOUT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: pnpm build
      # 주요 화면을 예제 모드로 찍고, 화면마다 오류 없이 그려지는지 확인한다. 그림은 산출물로 남는다
      # 브라우저는 내려받지 않고 실행기(ubuntu-latest)에 깔려 있는 Chrome을 쓴다
      - run: pnpm shots --viewport 1200x735 --theme mixed --sample default
        env:
          SHOTS_SKIP_BUILD: '1'
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
