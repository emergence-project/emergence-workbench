# PR마다 저장소 규칙의 검사(pnpm type-check, pnpm test)와 화면 빌드를 돌린다.
# 에이전트는 이 검사가 초록이면 PR을 합친다 (CLAUDE.md "반영 흐름").
# Actions 분량을 아끼려고:
# - main 푸시에서는 돌리지 않는다. PR이 한 번에 하나씩 합쳐지므로 PR 검사가 합친 뒤의 코드와 같다. 필요하면 Actions 화면에서 손으로 돌린다.
# - 문서만 바뀐 PR은 건너뛴다: docs/와 어디에 있든 .md. 다만 fixtures/·templates/의 .md는 예제·서식 내용이라(테스트와 화면 그림이 읽는다) 돌린다.
#   paths-ignore는 되살리는(!) 규칙이 없어 paths로 쓴다. 뒤 줄이 앞 줄을 이긴다.
# - 바깥 액션은 커밋 SHA로 고정하고 옆에 버전을 적는다 (태그는 옮겨질 수 있다). 올릴 때는 git ls-remote로 새 태그의 SHA를 찾는다.
name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'fixtures/**'
      - 'templates/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 소개 검사(check-about.mjs)가 PR의 커밋 메시지와 바뀐 파일을 기준 커밋과 견준다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # scripts/remote 테스트는 맥과 같은 zsh로 스크립트를 돌린다. 미러가 멈출 때 끊고 다시 하는 규칙은 그 스크립트 머리에
      - timeout-minutes: 6
        run: bash scripts/ci/apt-install.sh zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
        env:
          ABOUT_BASE: ${{ github.event.pull_request.base.sha }}
          ABOUT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # 화면 그림은 검사(type-check · test)와 나란히 따로 돈다 (11/20 "검사 시간이 병목": 한 줄로 돌면 약 1분 남짓 더 기다렸다)
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # 나눔 글꼴은 화면 그림의 한글용
      - timeout-minutes: 6
        run: bash scripts/ci/apt-install.sh fonts-nanum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 주요 화면을 예제 모드로 찍고, 화면마다 오류 없이 그려지는지 확인한다. 그림은 산출물로 남는다
      # 브라우저는 내려받지 않고 실행기(ubuntu-latest)에 깔려 있는 Chrome을 쓴다
      - run: pnpm shots --viewport 1200x735 --theme mixed --sample default
        env:
          SHOTS_SKIP_BUILD: '1'
          CHROMIUM_PATH: /usr/bin/google-chrome
      # 브라우저 검사: 누르고 적는 차례를 따라가며 초안 · 검색 결과가 사라지거나 뒤바뀌지 않는지 본다 (약 30초).
      # CI에서 돌지 않던 동안 사례 넷이 낡은 줄 아무도 몰랐다 (11/25 사용자 결정 "CI에 넣기"). 실패한 사례의 그림도 아래 산출물에 들어간다
      - run: pnpm test:browser
        env:
          SHOTS_SKIP_BUILD: '1'
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
